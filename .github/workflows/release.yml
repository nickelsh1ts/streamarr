---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Streamarr Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_HUB: nickelsh1ts/streamarr

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          persist-credentials: false
      - name: Get commit SHA
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The release commit made by semantic-release is the checked-out tag, not github.sha.
          context: git
          images: |
            ${{ env.DOCKER_HUB }}
            ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}},value=v${{ needs.release.outputs.new_release_version }}
          labels: org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.platform }} by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.DOCKER_HUB }},ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ steps.commit.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.epoch }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ghcr_digest: ${{ steps.merge.outputs.GHCR_DIGEST }}
      docker_hub_digest: ${{ steps.merge.outputs.DOCKER_HUB_DIGEST }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest lists
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          source_digests=(*)
          test "${#source_digests[@]}" -eq 2
          image_digests=()
          for image in "ghcr.io/${{ github.repository }}" "${{ env.DOCKER_HUB }}"; do
            sources=()
            for digest in "${source_digests[@]}"; do
              sources+=("${image}@sha256:${digest}")
            done
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:${VERSION%%.*}" \
              --tag "${image}:${VERSION%.*}" \
              --tag "${image}:${VERSION}" \
              "${sources[@]}"
            index=$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            test -n "$index"
            image_digests+=("${index}")
          done
          test "${#image_digests[@]}" -eq 2
          echo "GHCR_DIGEST=${image_digests[0]}" >> "$GITHUB_OUTPUT"
          echo "DOCKER_HUB_DIGEST=${image_digests[1]}" >> "$GITHUB_OUTPUT"

  sign:
    name: Sign images and create SBOM attestations
    needs: [release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      SBOM: streamarr-image-${{ needs.release.outputs.new_release_version }}.sbom
      GHCR_DIGEST: ${{ needs.publish.outputs.ghcr_digest }}
      DOCKER_HUB_DIGEST: ${{ needs.publish.outputs.docker_hub_digest }}
      COSIGN_YES: 'true'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign images
        run: |
          images=("ghcr.io/${GITHUB_REPOSITORY}@${GHCR_DIGEST}" "${DOCKER_HUB}@${DOCKER_HUB_DIGEST}")
          for image in "${images[@]}"; do
            cosign sign --recursive "$image"
          done
      - name: Generate SBOM
        # Both registries hold the same image digest, so one SBOM covers both.
        run: trivy image --format cyclonedx --output "$SBOM" "ghcr.io/${GITHUB_REPOSITORY}@${GHCR_DIGEST}"
      - name: Attest SBOM
        run: |
          images=("ghcr.io/${GITHUB_REPOSITORY}@${GHCR_DIGEST}" "${DOCKER_HUB}@${DOCKER_HUB_DIGEST}")
          for image in "${images[@]}"; do
            cosign attest --type cyclonedx --predicate "$SBOM" "$image"
          done
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ env.SBOM }}
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify signatures and attestations
    needs: [publish, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GHCR_DIGEST: ${{ needs.publish.outputs.ghcr_digest }}
      DOCKER_HUB_DIGEST: ${{ needs.publish.outputs.docker_hub_digest }}
      CERT_IDENTITY: https://github.com/${{ github.workflow_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signatures and SBOM attestations
        run: |
          identity=(--certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          images=("ghcr.io/${GITHUB_REPOSITORY}@${GHCR_DIGEST}" "${DOCKER_HUB}@${DOCKER_HUB_DIGEST}")
          for image in "${images[@]}"; do
            cosign verify "${identity[@]}" "$image"
            cosign verify-attestation --type cyclonedx "${identity[@]}" "$image"
            # Platform manifests are signed via --recursive; verify each one listed in the index.
            index=$(docker buildx imagetools inspect "$image" --raw)
            for platform in linux/amd64 linux/arm64; do
              digest=$(jq -er --arg p "$platform" \
                '.manifests[] | select("\(.platform.os)/\(.platform.architecture)" == $p) | .digest' <<< "$index")
              cosign verify "${identity[@]}" "${image%@*}@${digest}"
            done
          done

  publish-release:
    name: Publish verified GitHub Release
    needs: [release, sign, verify]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.new_release_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - name: Attach SBOM and publish release
        run: |
          gh release upload "v${VERSION}" --clobber "streamarr-image-${VERSION}.sbom"
          gh release edit "v${VERSION}" --draft=false

  discord:
    name: Send Discord Notification
    needs: [release, build, publish, sign, verify, publish-release]
    if: always() && (needs.release.outputs.new_release_published == 'true' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post Status to Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          title: ${{ github.workflow }}
          nofail: true
