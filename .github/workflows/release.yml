---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Streamarr Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_HUB: nickelsh1ts/streamarr

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 25
      - name: Install and Enable Corepack
        run: npm install -g corepack --force && corepack enable
      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: pnpm install --frozen-lockfile
      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          persist-credentials: false
      - name: Get commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.DOCKER_HUB }}:build-${{ steps.commit.outputs.sha }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}:build-${{ steps.commit.outputs.sha }}-${{ matrix.arch }}
          build-args: |
            COMMIT_TAG=${{ steps.commit.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.ts.outputs.TIMESTAMP }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.new_release_version }}
            org.opencontainers.image.created=${{ steps.ts.outputs.TIMESTAMP }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true

  publish:
    name: Publish multi-arch image
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      docker_hub_digest: ${{ steps.digests.outputs.DOCKER_HUB_DIGEST }}
      ghcr_digest: ${{ steps.digests.outputs.GHCR_DIGEST }}
      build_sha: ${{ steps.digests.outputs.BUILD_SHA }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          persist-credentials: false
      - name: Get commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Commit timestamp
        id: ts
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Docker Hub manifests
        run: |
          docker buildx imagetools create \
            --tag "${{ env.DOCKER_HUB }}:latest" \
            "${{ env.DOCKER_HUB }}:build-${{ steps.commit.outputs.sha }}-amd64" \
            "${{ env.DOCKER_HUB }}:build-${{ steps.commit.outputs.sha }}-arm64"
          docker buildx imagetools create \
            --tag "${{ env.DOCKER_HUB }}:${{ needs.release.outputs.new_release_version }}" \
            "${{ env.DOCKER_HUB }}:build-${{ steps.commit.outputs.sha }}-amd64" \
            "${{ env.DOCKER_HUB }}:build-${{ steps.commit.outputs.sha }}-arm64"
      - name: Create GHCR manifests
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:build-${{ steps.commit.outputs.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:build-${{ steps.commit.outputs.sha }}-arm64"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new_release_version }}" \
            "ghcr.io/${{ github.repository }}:build-${{ steps.commit.outputs.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:build-${{ steps.commit.outputs.sha }}-arm64"
      - name: Resolve manifest digest
        id: digests
        run: |
          DOCKER_HUB_DIGEST=$(docker buildx imagetools inspect "${{ env.DOCKER_HUB }}:${{ needs.release.outputs.new_release_version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          GHCR_DIGEST=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new_release_version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "DOCKER_HUB_DIGEST=$DOCKER_HUB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "GHCR_DIGEST=$GHCR_DIGEST" >> "$GITHUB_OUTPUT"
          echo "BUILD_SHA=${{ steps.commit.outputs.sha }}" >> "$GITHUB_OUTPUT"
          test -n "$DOCKER_HUB_DIGEST" && test -n "$GHCR_DIGEST"

  sign:
    name: Sign images and create SBOM attestations
    needs: [release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.new_release_version }}
      COSIGN_YES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign images
        run: |
          cosign sign --recursive "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.ghcr_digest }}"
          cosign sign --recursive "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.docker_hub_digest }}"
      - name: Generate SBOMs
        run: |
          trivy image --format cyclonedx --output streamarr-ghcr-image-${{ env.VERSION }}.sbom \
            "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.ghcr_digest }}"

          trivy image --format cyclonedx --output streamarr-dockerhub-image-${{ env.VERSION }}.sbom \
            "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.docker_hub_digest }}"
      - name: Attest SBOMs
        run: |
          cosign attest \
            --type cyclonedx \
            --predicate streamarr-ghcr-image-${{ env.VERSION }}.sbom \
            "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.ghcr_digest }}"

          cosign attest \
            --type cyclonedx \
            --predicate streamarr-dockerhub-image-${{ env.VERSION }}.sbom \
            "${{ env.DOCKER_HUB }}@${{ needs.publish.outputs.docker_hub_digest }}"
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms-${{ env.VERSION }}
          path: '*.sbom'
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify signatures and attestations
    needs: [publish, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DOCKER_HUB_DIGEST: ${{ needs.publish.outputs.docker_hub_digest }}
      GHCR_DIGEST: ${{ needs.publish.outputs.ghcr_digest }}
      BUILD_SHA: ${{ needs.publish.outputs.build_sha }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signatures
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${{ env.GHCR_DIGEST }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          cosign verify "${{ env.DOCKER_HUB }}@${{ env.DOCKER_HUB_DIGEST }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Verify platform signatures
        run: |
          for arch in amd64 arm64; do
            cosign verify "ghcr.io/${{ github.repository }}:build-${BUILD_SHA}-${arch}" \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            cosign verify "${{ env.DOCKER_HUB }}:build-${BUILD_SHA}-${arch}" \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done
      - name: Verify SBOM attestations
        run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}@${{ env.GHCR_DIGEST }}"

          cosign verify-attestation --type cyclonedx \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.DOCKER_HUB }}@${{ env.DOCKER_HUB_DIGEST }}"

  publish-release:
    name: Publish verified GitHub Release
    needs: [release, sign, verify]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.new_release_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sboms-${{ needs.release.outputs.new_release_version }}
      - name: Attach SBOMs and publish release
        run: |
          tag="v${VERSION}"
          gh release upload "$tag" --clobber \
            "streamarr-ghcr-image-${VERSION}.sbom" \
            "streamarr-dockerhub-image-${VERSION}.sbom"
          gh release edit "$tag" --draft=false

  discord:
    name: Send Discord Notification
    needs: [release, publish-release]
    if: always() && (needs.release.outputs.new_release_published == 'true' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get Build Job Status
        uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3
      - name: Combine Job Status
        id: status
        run: |
          failures=(neutral skipped timed_out action_required)
          status="$WORKFLOW_CONCLUSION"
          for failure in "${failures[@]}"; do
            if [ "$WORKFLOW_CONCLUSION" = "$failure" ]; then
              status="failure"
              break
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Post Status to Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          title: ${{ github.workflow }}
          nofail: true
